##############################################################################
# openspec/config.yaml — SpecAI
# Generated by sdd-init | Mode: hybrid | 2026-06-02
##############################################################################

project:
  name: SpecAI
  repo: github.com/KevG1t/SpecAI
  description: >
    CLI tool written in Go that installs and syncs Gentle AI configuration
    (rules, skills) across IDEs using Bubble Tea TUI.

# ─── Stack ───────────────────────────────────────────────────────────────────
stack:
  language: go
  go_version: "1.26.3"
  module: github.com/KevG1t/SpecAI

  dependencies:
    direct:
      - github.com/charmbracelet/bubbletea@v1.3.10   # TUI framework (MVU / Elm arch)
      - github.com/charmbracelet/lipgloss@v1.1.0     # Terminal styling
    indirect_notable:
      - github.com/charmbracelet/bubbles@v1.0.0      # TUI component library
      - github.com/spf13/afero@v1.15.0               # FS abstraction (testability)
      # Note: embed.FS used directly via stdlib for asset embedding

  build:
    tool: goreleaser
    config: .goreleaser.yaml
    binary: specai

  internal_packages:
    - backup      # Snapshot / compression / restore / retention
    - catalog     # Agent and skill catalog
    - model       # Model capability, assignment, selection
    - pipeline    # Orchestration pipeline
    - planner     # Execution ordering, resolver, review
    - state       # App state management
    - steps       # Executable install/sync/uninstall/upgrade steps
    - system      # IDE detection, system config scan, dependency checks
    - templates   # Embedded asset templates (embed.FS)
    - tui         # Bubble Tea TUI model and screens
    - update      # Update checker and renderer
    - verify      # Scenario verification

# ─── SDD Persistence ─────────────────────────────────────────────────────────
sdd:
  mode: hybrid        # engram + openspec
  engram_project: SpecAI
  engram_server: sdd-memory
  artifact_store: hybrid
  changes_dir: openspec/changes

# ─── Testing ─────────────────────────────────────────────────────────────────
testing:
  runner: go test
  command: go test ./...
  coverage_command: go test -cover ./...
  race_command: go test -race ./...

  strict_tdd: true
  strict_tdd_reason: >
    34 *_test.go files found across 13 packages with no strict TDD marker.
    Broad test coverage (all internal packages covered) defaults to strict_tdd=true
    per SDD init rules.

  layers:
    unit:
      present: true
      packages:
        - internal/backup       # compression, manifest, restore, retention, snapshot
        - internal/catalog      # agents, skills
        - internal/model        # capability, kiro_model, model_assignment, selection, types
        - internal/pipeline     # orchestrator
        - internal/planner      # execute, order, resolver, review
        - internal/state        # state
        - internal/steps        # inject_assets, sync, uninstall, upgrade
        - internal/system       # config_scan, deps, detect, guard, install_deps, path
        - internal/tui          # model, screens/install
        - internal/update       # check, render
        - internal/verify       # scenario
        - scripts               # extract_assets
      patterns:
        - table-driven tests (t.Run subtests)
        - stub interfaces (e.g. stubIDE implementing IDEAdapter)
        - t.TempDir() for filesystem isolation
        - afero for FS abstraction in non-test code

    integration:
      present: false
      notes: "No dedicated integration layer detected; integration tested via unit tests with real FS (t.TempDir)"

    e2e:
      present: false
      notes: "No teatest (Bubble Tea test helper) usage detected; TUI tested at model/msg level only"

    golden_files:
      present: false
      notes: "No testdata/golden directories found"

  coverage:
    enforced: false
    threshold: null
    notes: "No coverage gate in CI (release.yml). go test -cover available manually."

  linter:
    present: false
    tool: null
    config: null
    notes: "No .golangci.yml or equivalent found. No lint step in CI."

  formatter:
    tool: gofmt
    enforced: false
    notes: "Standard Go toolchain; no explicit gofmt CI step."

  type_checker:
    tool: go vet
    enforced: false
    notes: "No explicit go vet step in CI."

# ─── CI ──────────────────────────────────────────────────────────────────────
ci:
  provider: GitHub Actions
  workflows:
    - name: Release
      file: .github/workflows/release.yml
      triggers: [push tags "v*"]
      steps:
        - goreleaser (build + release)
        - deploy install script to GitHub Pages
  notes: >
    CI is release-only. No test, lint, or coverage workflow exists.
    Tests must be run locally with `go test ./...`.
    Recommendation: add a `ci.yml` workflow that runs `go test -race ./...` on PR.
