version: 2

project_name: specai

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/specai
    binary: specai
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

brews:
  - repository:
      owner: KevG1t
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    name: specai
    homepage: "https://github.com/KevG1t/SpecAI"
    description: "SpecAI — Ecosystem, Frameworks, Workflows for AI coding agents."
    license: "MIT"
    commit_msg_template: "chore: update specai formula to {{ .Tag }}"

scoops:
  - repository:
      owner: KevG1t
      name: scoop-bucket
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    name: specai
    homepage: "https://github.com/KevG1t/SpecAI"
    description: "SpecAI — Ecosystem, Frameworks, Workflows for AI coding agents."
    license: MIT
    commit_msg_template: "chore: update specai to {{ .Tag }}"
